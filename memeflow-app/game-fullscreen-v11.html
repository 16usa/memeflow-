<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
  >
  <meta name="theme-color" content="#010408">
  <title>MEMEFLOW · Flight View</title>
  <link rel="stylesheet" href="/game-fullscreen-v11.css?v=1786765057">
<!-- MEMEFLOW_GLOBAL_TERMINAL_FONT_V207_2 -->
<link rel="stylesheet" href="/memeflow-terminal-font-v207-2.css?v=2072-20260922">
<!-- /MEMEFLOW_GLOBAL_TERMINAL_FONT_V207_2 -->
<link rel="stylesheet" href="/site-header-unify-v213.css?v=214">
<link rel="stylesheet" href="memeflow-ibm-plex-sans-v1.css">

<!-- MEMEFLOW_GLOBAL_INTER_ONLY_V2 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/memeflow-inter-only-v2.css?v=global-inter-only-v2-20261001">
<!-- /MEMEFLOW_GLOBAL_INTER_ONLY_V2 -->

</head>
<body>
  <main id="mfV11Root">
    <iframe
      id="mfV11Frame"
      title="MEMEFLOW Game Fullscreen"
      allow="fullscreen"
    ></iframe>

    <div id="mfV11Loading" class="mf-v11-loading" role="status">
      <span class="mf-v11-dot"></span>
      <div>
        <strong>MEMEFLOW FLIGHT VIEW</strong>
        <small>Connecting to the current Game…</small>
      </div>
    </div>

    <div id="mfV11Toast" class="mf-v11-toast" hidden></div>

    <nav class="mf-v11-top-actions" aria-label="Flight view controls">
      <button
        id="mfV11NativeFullscreen"
        type="button"
        title="Browser fullscreen"
      >
        <span aria-hidden="true">⛶</span>
        <span>FULL SCREEN</span>
      </button>

      <button
        id="mfV11Exit"
        type="button"
        title="Return to Game"
      >
        <span aria-hidden="true">×</span>
        <span>EXIT</span>
      </button>
    </nav>
  </main>

  <script src="/game-fullscreen-v11.js?v=1786765057" defer></script>
</body>
</html>
