<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1688" viewBox="0 0 780 1688">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#081118"/>
    <stop offset="1" stop-color="#05090d"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#39d7ff" stop-opacity=".25"/>
    <stop offset=".5" stop-color="#39d7ff"/>
    <stop offset="1" stop-color="#39d7ff" stop-opacity=".25"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="780" height="1688" rx="38" fill="url(#bg)"/>
<rect x="2" y="2" width="776" height="1684" rx="36"
 fill="none" stroke="#17313d" stroke-width="4"/>

<text x="58" y="94" fill="#49d9ff" font-size="22"
 font-family="Arial,sans-serif" font-weight="700" letter-spacing="5">
MEMEFLOW
</text>
<text x="58" y="140" fill="#eef7fb" font-size="42"
 font-family="Arial,sans-serif" font-weight="700">
How It Works
</text>
<text x="58" y="180" fill="#708996" font-size="20"
 font-family="Arial,sans-serif">
Non-custodial Smart Vault architecture
</text>

<line x1="390" y1="300" x2="390" y2="1320"
 stroke="url(#line)" stroke-width="4" filter="url(#glow)"/>

<g font-family="Arial,sans-serif">
  <g transform="translate(90 260)">
    <rect width="600" height="170" rx="26" fill="#09141b" stroke="#1d4655" stroke-width="2"/>
    <circle cx="65" cy="85" r="27" fill="#0c2732" stroke="#41d8ff" stroke-width="2"/>
    <text x="115" y="72" fill="#f1f8fb" font-size="28" font-weight="700">YOUR WALLET</text>
    <text x="115" y="111" fill="#77919d" font-size="20">You approve deposits and withdrawals</text>
  </g>

  <g transform="translate(90 500)">
    <rect width="600" height="190" rx="26" fill="#09141b" stroke="#247087" stroke-width="2"/>
    <circle cx="65" cy="95" r="27" fill="#0c2c38" stroke="#41d8ff" stroke-width="2"/>
    <text x="115" y="78" fill="#f1f8fb" font-size="28" font-weight="700">SMART VAULT</text>
    <text x="115" y="118" fill="#77919d" font-size="20">On-chain rules control what can happen</text>
    <text x="115" y="150" fill="#55cfe9" font-size="18">Funds remain governed by the program</text>
  </g>

  <g transform="translate(90 770)">
    <rect width="600" height="190" rx="26" fill="#09141b" stroke="#1d4655" stroke-width="2"/>
    <circle cx="65" cy="95" r="27" fill="#0c2732" stroke="#41d8ff" stroke-width="2"/>
    <text x="115" y="78" fill="#f1f8fb" font-size="28" font-weight="700">EXECUTION ENGINE</text>
    <text x="115" y="118" fill="#77919d" font-size="20">Executes only within your configured policy</text>
    <text x="115" y="150" fill="#55cfe9" font-size="18">No unrestricted custody</text>
  </g>

  <g transform="translate(90 1040)">
    <rect width="600" height="190" rx="26" fill="#09141b" stroke="#1d4655" stroke-width="2"/>
    <circle cx="65" cy="95" r="27" fill="#0c2732" stroke="#41d8ff" stroke-width="2"/>
    <text x="115" y="78" fill="#f1f8fb" font-size="28" font-weight="700">SOLANA MARKET</text>
    <text x="115" y="118" fill="#77919d" font-size="20">Trades settle transparently on-chain</text>
    <text x="115" y="150" fill="#55cfe9" font-size="18">Every transaction is verifiable</text>
  </g>

  <g transform="translate(90 1350)">
    <rect width="600" height="185" rx="26" fill="#081218" stroke="#26596a" stroke-width="2"/>
    <text x="300" y="65" text-anchor="middle" fill="#48d8ff"
      font-size="20" font-weight="700" letter-spacing="3">CONTROL STAYS WITH YOU</text>
    <text x="300" y="105" text-anchor="middle" fill="#edf7fb"
      font-size="25" font-weight="700">Deposit → Trade → Withdraw</text>
    <text x="300" y="143" text-anchor="middle" fill="#758d99"
      font-size="18">Understand the complete flow</text>
  </g>
</g>
</svg>