<script id="mfThemeBootV1">
(() => {
  try {
    const value = localStorage.getItem('memeflow.theme.v1');
    const theme = value === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  } catch {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>

<!-- ===== MEMEFLOW_TOKEN_FLOW_PERIOD_VISUAL_FIX_V14 ===== -->
<script>
(() => {
  'use strict';

  /*
    VISUAL-ONLY SINGLE SOURCE OF TRUTH.

    V12 and V13 are removed by the installer because they both tried to
    re-paint the same four controls and could overwrite the user's click.

    Existing MEMEFLOW handlers still perform the REAL filter action.
    V14 only paints the clicked period.
  */

  const PERIODS = new Set(['ALL', '1H', '6H', '24H']);

  let selectedPeriod = 'ALL';
  let initialized = false;

  function labelOf(button) {
    return String(button?.textContent || '')
      .replace(/\s+/g, ' ')
      .trim()
      .toUpperCase();
  }

  function buttons() {
    return [...document.querySelectorAll('button')]
      .filter(button => PERIODS.has(labelOf(button)));
  }

  function setVisual(button, selected) {
    /*
      Inline !important intentionally beats the old page-specific cyan rules.
      Only the three approved neutral colors are used here.
    */
    button.style.setProperty(
      'background',
      '#EBEBEB',
      'important'
    );
    button.style.setProperty(
      'background-color',
      '#EBEBEB',
      'important'
    );
    button.style.setProperty(
      'border-color',
      selected ? 'var(--cyan)' : 'transparent',
      'important'
    );
    button.style.setProperty(
      'box-shadow',
      selected
        ? 'inset 0 0 0 1px var(--cyan)'
        : 'none',
      'important'
    );
    button.style.setProperty(
      'outline',
      '0',
      'important'
    );
  }

  function paint() {
    const list = buttons();
    if (list.length < 3) return false;

    for (const button of list) {
      setVisual(
        button,
        labelOf(button) === selectedPeriod
      );
    }

    return true;
  }

  function inferInitialSelection() {
    const list = buttons();
    if (list.length < 3) return;

    /*
      If the existing UI exposes exactly one real semantic selection,
      respect it on first load. Otherwise ALL is the safe initial visual state.
      We DO NOT inspect border color because the old bug paints multiple
      buttons cyan while ALL is active.
    */
    const explicit = list.filter(button =>
      button.getAttribute('aria-pressed') === 'true' ||
      button.getAttribute('aria-current') === 'true' ||
      button.dataset.selected === 'true' ||
      button.dataset.active === 'true' ||
      button.classList.contains('is-active')
    );

    if (explicit.length === 1) {
      selectedPeriod = labelOf(explicit[0]);
    } else {
      selectedPeriod = 'ALL';
    }

    initialized = true;
    paint();
  }

  /*
    Capture the tap before page code can mutate classes/styles.
    The actual page handler still receives the event normally.
  */
  document.addEventListener(
    'click',
    event => {
      const button = event.target.closest?.('button');
      if (!button) return;

      const label = labelOf(button);
      if (!PERIODS.has(label)) return;

      selectedPeriod = label;
      initialized = true;

      paint();

      /*
        Existing filter code may update/rebuild UI immediately after our
        handler. Re-assert the SAME clicked visual state — never read a stale
        storage value and never force ALL.
      */
      queueMicrotask(paint);
      requestAnimationFrame(paint);
      setTimeout(paint, 0);
      setTimeout(paint, 60);
      setTimeout(paint, 180);
    },
    true
  );

  /*
    If runtime code rebuilds the period row, re-apply the last user choice.
    Observe child replacement only; style/class writes are intentionally not
    observed, preventing observer feedback loops.
  */
  let scheduled = false;

  const observer = new MutationObserver(() => {
    if (scheduled) return;

    scheduled = true;

    requestAnimationFrame(() => {
      scheduled = false;

      if (!initialized) {
        inferInitialSelection();
      } else {
        paint();
      }
    });
  });

  observer.observe(document.documentElement, {
    subtree: true,
    childList: true
  });

  function boot() {
    inferInitialSelection();

    /*
      Runtime controls can be injected just after DOMContentLoaded.
      Short retries only initialize; after initialization the user's clicks
      remain the visual source of truth.
    */
    if (!initialized) {
      setTimeout(inferInitialSelection, 50);
      setTimeout(inferInitialSelection, 150);
      setTimeout(inferInitialSelection, 400);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener(
      'DOMContentLoaded',
      boot,
      { once: true }
    );
  } else {
    boot();
  }
})();
</script>
