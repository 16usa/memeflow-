<g filter="url(#softShadow)">
  <path d="
    M614 620
    C660 668 670 750 650 813
    C635 857 601 866 574 833
    C547 800 550 746 530 702
    C511 659 551 612 614 620Z"
    fill="url(#suit)"
    stroke="#24564d" stroke-width="8"/>

  <path d="
    M655 807
    C697 821 723 862 710 894
    C696 928 642 930 587 916
    C548 906 540 867 570 842
    C598 818 623 801 655 807Z"
    fill="url(#frog)"
    stroke="#087b31" stroke-width="8"/>
</g>

</svg>
