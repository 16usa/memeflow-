<!doctype html>
<html lang="en">
<head>
<!-- MEMEFLOW_LIGHT_THEME_BOOT_V1 -->
<script id="mfThemeBootV1">
(() => {
  try {
    const value = localStorage.getItem('memeflow.theme.v1');
    const theme = value === 'light' ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  } catch {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
<!-- /MEMEFLOW_LIGHT_THEME_BOOT_V1 -->
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />

  <meta
    name="color-scheme"
    content="dark"
  />

  <title>MEMEFLOW · Token Flow</title>

  <link
    rel="stylesheet"
    href="/system-tokens.css?v=token-flow-toolbar-fixed-lock-v2-20260830"
  />
<link rel="stylesheet" href="/memeflow-brand.css?v=typography-clean-source-v1-20260830">
  <!-- MEMEFLOW_GLOBAL_RIGHT_DRAWER_NAV_V1 -->
  <link rel="stylesheet" href="/memeflow-nav.css?v=global-right-drawer-frameless-v2-20260829">
  <link rel="stylesheet" href="/memeflow-header.css?v=canonical-header-v1-7-20260830">
<!-- MEMEFLOW_LIGHT_THEME_ASSETS_V1 -->
<link rel="stylesheet" href="/memeflow-theme.css?v=token-flow-sort-sheet-premium-light-v1-20260830">
<script src="/memeflow-theme.js?v=light-theme-v1-20260830" defer></script>
<!-- /MEMEFLOW_LIGHT_THEME_ASSETS_V1 -->
</head>

<body>

  <main class="flow-page">

    <header class="flow-header mf-site-header">

      <div class="header-left">
        <!-- MEMEFLOW_REMOVE_LEGACY_BACK_BUTTONS_V1: legacy back arrow removed -->
<div class="brand-mark" aria-hidden="true"><img class="mf-brand-img" src="/brand/memeflow-dragonfly-dark.png?v=final-v5" alt=""></div>

        <div class="header-title">
          <span>MEMEFLOW</span>
          <strong>Token Flow</strong>
        </div>

      </div>

      <div class="live-status">
        <i></i>
        <span id="discoveryLiveLabel">LIVE</span>
      </div>

    </header>

    <section class="flow-hero">

      <div>
        <span class="eyebrow">
          REAL-TIME PIPELINE
        </span>

        <h1>
          Live token states
        </h1>

        <p>
          Current tokens moving through the MEMEFLOW decision pipeline.
        </p>
      </div>

      <div class="hero-counter">
        <span>Visible</span>
        <strong id="visibleCount">0</strong>
        <span
          id="scannerStatus"
          class="scanner-status"
          title="Live scanner status"
        >Scanner —</span>
      </div>

    </section>

    <section class="state-summary">

      <button
        class="summary-card all active"
        type="button"
        data-filter="all"
      >
        <span>All</span>
        <strong id="countAll">0</strong>
      </button>

      <button
        class="summary-card ready"
        type="button"
        data-filter="ready"
      >
        <span>Buy Ready</span>
        <strong id="countReady">0</strong>
      </button>

      <button
        class="summary-card watch"
        type="button"
        data-filter="watch"
      >
        <span>Watch</span>
        <strong id="countWatch">0</strong>
      </button>

      <button
        class="summary-card waiting"
        type="button"
        data-filter="waiting"
      >
        <span>Waiting</span>
        <strong id="countWaiting">0</strong>
      </button>

      <button
        class="summary-card blocked"
        type="button"
        data-filter="blocked"
      >
        <span>Blocked</span>
        <strong id="countBlocked">0</strong>
      </button>

    </section>

    <section class="flow-toolbar">

      <div class="search-wrap">
        <span>⌕</span>

        <input
          id="tokenSearch"
          type="search"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search mint"
        />
      </div>

      <div class="refresh-info">
        <span id="lastUpdate">
          Waiting for telemetry
        </span>

        <button
          id="refreshButton"
          type="button"
        >
          Refresh
        </button>
      </div>

    </section>

    <section
      id="tokenList"
      class="token-list"
    >
    </section>

    <section
      id="emptyState"
      class="empty-state"
      hidden
    >
      <strong>No tokens found</strong>
      <span>Try another filter or search.</span>
    </section>

    <footer class="pagination">

      <button
        id="prevPage"
        type="button"
      >
        ← Previous
      </button>

      <div class="page-state">
        <span>Page</span>
        <strong id="pageNumber">1</strong>
        <span>of</span>
        <strong id="pageTotal">1</strong>
      </div>

      <button
        id="nextPage"
        type="button"
      >
        Next →
      </button>

    </footer>

  </main>

  <script
    type="module"
    src="/system-tokens.js?v=token-flow-toolbar-fixed-lock-v2-20260830"
  ></script>
<script src="/memeflow-nav.js?v=global-right-drawer-v2-how-it-works" defer></script>
</body>
</html>
