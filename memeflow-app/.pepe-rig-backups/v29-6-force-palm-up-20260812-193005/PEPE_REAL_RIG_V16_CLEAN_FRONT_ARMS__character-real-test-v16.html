<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEPE REAL RIG V16</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#10252b,#020709 68%);font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#stage{position:fixed;inset:0}
#hud{position:fixed;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;padding:13px 15px;border:1px solid #1b5d4a;border-radius:14px;color:#fff;background:#041013cc;z-index:3;font-size:12px;letter-spacing:.12em}
#hud strong{display:block;margin-bottom:4px;color:#7fffc8}
#buttons{position:fixed;left:18px;right:18px;bottom:max(18px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:8px;z-index:3}
button{min-height:56px;border:1px solid #1b5d4a;border-radius:13px;background:#061316dd;color:#fff;font-weight:800}
#error{display:none}
body[data-error="1"] #error{display:block;position:fixed;inset:20% 8%;z-index:9;color:#ff8e8e;background:#180606e8;border:1px solid #7d2c2c;border-radius:14px;padding:18px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"><strong>PEPE REAL RIG V16 · CLEAN PARTS · FRONT ARMS</strong><span id="state">LOADING…</span></div>
<div id="buttons"><button id="up">▲ UP</button><button id="idle">● IDLE</button><button id="down">▼ DOWN</button></div>
<div id="error">V16 failed to load. Open the browser console / Replit logs.</div>
<script type="module" src="/character-real-test-v16.js?v=1601"></script>
</body>
</html>
