<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" role="img" aria-label="Pepe-style meme frog riding a rocket">
  <defs>
    <linearGradient id="metal" x1="0" x2="1"><stop stop-color="#6b7885"/><stop offset=".33" stop-color="#eef4f7"/><stop offset=".54" stop-color="#b9c7cf"/><stop offset=".78" stop-color="#7b8993"/><stop offset="1" stop-color="#39434d"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#ff8a63"/><stop offset=".45" stop-color="#ef3e50"/><stop offset="1" stop-color="#9b1830"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#87d85d"/><stop offset=".54" stop-color="#4bae4f"/><stop offset="1" stop-color="#246d3d"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26313b"/><stop offset="1" stop-color="#0a1016"/></linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff7b0"/><stop offset=".27" stop-color="#ffcf4f"/><stop offset=".61" stop-color="#ff6e38"/><stop offset="1" stop-color="#ff244e" stop-opacity="0"/></linearGradient>
    <radialGradient id="glass"><stop stop-color="#c9fbff"/><stop offset=".48" stop-color="#4fc7e4"/><stop offset="1" stop-color="#143747"/></radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".48"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#shadow)" transform="rotate(22 210 300)">
    <!-- rear fins -->
    <path d="M152 396 L92 455 L160 449 L184 404Z" fill="url(#red)" stroke="#ff9a75" stroke-width="3"/>
    <path d="M268 397 L330 455 L261 449 L236 404Z" fill="url(#red)" stroke="#ff9a75" stroke-width="3"/>
    <!-- rocket body -->
    <path d="M139 190 C151 129 182 85 210 66 C239 86 270 130 282 190 L271 397 C258 444 237 469 210 482 C183 469 162 444 149 397Z" fill="url(#metal)" stroke="#d9e4e9" stroke-width="4"/>
    <path d="M139 190 C157 151 182 118 210 97 C238 119 264 151 282 190 L272 231 C232 213 188 213 148 231Z" fill="url(#red)" stroke="#ff9a75" stroke-width="3"/>
    <path d="M173 91 C187 76 200 66 210 60 C220 66 233 76 247 91 C233 84 188 84 173 91Z" fill="#ff5063"/>
    <!-- seams -->
    <path d="M155 257 C194 241 229 241 268 257" fill="none" stroke="#596875" stroke-width="3" opacity=".7"/>
    <path d="M153 365 C192 350 230 350 273 365" fill="none" stroke="#596875" stroke-width="3" opacity=".7"/>
    <!-- window -->
    <circle cx="210" cy="288" r="51" fill="#4c5963" stroke="#1d262d" stroke-width="8"/>
    <circle cx="210" cy="288" r="39" fill="url(#glass)" stroke="#bfeef8" stroke-width="3"/>
    <!-- tiny frog in window -->
    <ellipse cx="210" cy="293" rx="26" ry="20" fill="url(#green)" stroke="#245d38" stroke-width="3"/>
    <circle cx="198" cy="281" r="9" fill="#77cc59"/><circle cx="222" cy="281" r="9" fill="#77cc59"/>
    <circle cx="199" cy="281" r="3.4" fill="#0b1013"/><circle cx="221" cy="281" r="3.4" fill="#0b1013"/>
    <path d="M190 298 Q210 313 232 297" fill="#d46d51" stroke="#4d2c25" stroke-width="3"/>
    <!-- hoodie torso seated on rocket -->
    <path d="M102 195 C108 142 142 120 186 133 C221 145 236 175 229 213 C222 249 188 267 143 256 C111 248 96 226 102 195Z" fill="url(#hood)" stroke="#3a4854" stroke-width="4"/>
    <path d="M116 207 C136 214 166 217 194 209" fill="none" stroke="#56636f" stroke-width="4" opacity=".65"/>
    <!-- frog head -->
    <ellipse cx="151" cy="112" rx="67" ry="55" fill="url(#green)" stroke="#215e38" stroke-width="4"/>
    <circle cx="116" cy="77" r="22" fill="#76cf58" stroke="#245d38" stroke-width="4"/>
    <circle cx="178" cy="75" r="22" fill="#76cf58" stroke="#245d38" stroke-width="4"/>
    <!-- glasses -->
    <rect x="94" y="69" width="46" height="26" rx="12" fill="#11171c" stroke="#838d94" stroke-width="3"/>
    <rect x="151" y="68" width="47" height="26" rx="12" fill="#11171c" stroke="#838d94" stroke-width="3"/>
    <path d="M140 80 L151 79" stroke="#838d94" stroke-width="4"/>
    <path d="M101 75 L124 70" stroke="#e7f7ff" stroke-width="4" opacity=".62"/>
    <path d="M158 74 L181 70" stroke="#e7f7ff" stroke-width="4" opacity=".62"/>
    <!-- mouth -->
    <path d="M99 124 Q148 159 202 119 Q175 158 127 152 Q105 149 99 124Z" fill="#e07b57" stroke="#58372f" stroke-width="4"/>
    <path d="M115 134 Q149 149 185 131" fill="none" stroke="#fff4d8" stroke-width="3" opacity=".82"/>
    <!-- left leg -->
    <path d="M113 238 C83 249 78 282 99 298 C120 315 144 297 153 270 C157 254 141 234 113 238Z" fill="url(#green)" stroke="#245d38" stroke-width="4"/>
    <path d="M105 293 Q89 310 96 323 Q113 330 132 303" fill="#43505b" stroke="#202a31" stroke-width="4"/>
    <!-- arms -->
    <path d="M183 168 C223 170 247 188 270 211" fill="none" stroke="#242f38" stroke-width="25" stroke-linecap="round"/>
    <path d="M267 209 C284 205 295 216 287 230 C277 245 260 236 257 223Z" fill="url(#green)" stroke="#245d38" stroke-width="4"/>
    <path d="M113 176 C83 183 65 196 52 216" fill="none" stroke="#242f38" stroke-width="23" stroke-linecap="round"/>
    <path d="M49 211 C33 213 23 225 31 237 C41 250 57 242 64 226Z" fill="url(#green)" stroke="#245d38" stroke-width="4"/>
    <!-- raised pointing hand -->
    <path d="M243 154 C268 128 285 103 296 76" fill="none" stroke="#2a793f" stroke-width="18" stroke-linecap="round"/>
    <circle cx="243" cy="154" r="13" fill="#61bd50" stroke="#245d38" stroke-width="4"/>
    <path d="M296 78 L303 44" stroke="#58b94c" stroke-width="15" stroke-linecap="round"/>
    <path d="M296 75 L280 60" stroke="#58b94c" stroke-width="12" stroke-linecap="round"/>
    <path d="M297 77 L315 66" stroke="#58b94c" stroke-width="12" stroke-linecap="round"/>
    <!-- highlights -->
    <path d="M158 212 C176 220 195 221 214 213" fill="none" stroke="#fff" stroke-width="3" opacity=".22"/>
  </g>
</svg>
