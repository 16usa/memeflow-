<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MEMEFLOW True 3D Lab</title>
  <style>
    :root {
      --bg: #020507;
      --panel: rgba(7, 13, 19, 0.88);
      --line: rgba(94, 146, 176, 0.24);
      --text: #eef5fb;
      --muted: #8ea2b2;
      --accent: #75ecff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% 10%, rgba(40, 74, 110, 0.16), transparent 40%),
        #020507;
      color: var(--text);
      font-family: Arial, sans-serif;
    }
    .page {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 10px;
      padding: 14px;
    }
    .topbar, .titlebar {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(8,13,18,0.96), rgba(5,9,14,0.96));
      box-shadow: inset 0 0 0 1px rgba(46, 84, 102, 0.18);
    }
    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
    }
    .brand {
      display: flex;
      gap: 16px;
      align-items: center;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }
    .logo {
      width: 34px; height: 34px;
      border-radius: 8px;
      background: linear-gradient(135deg, #74f4a4, #70d9ff);
      clip-path: polygon(0 0, 22% 0, 50% 34%, 78% 0, 100% 0, 58% 100%, 42% 100%);
      filter: drop-shadow(0 0 12px rgba(117, 232, 255, 0.55));
    }
    .actions { display: flex; gap: 10px; }
    .btn {
      min-width: 128px;
      border: 1px solid rgba(89, 132, 159, 0.28);
      border-radius: 16px;
      background: rgba(5, 10, 15, 0.8);
      color: var(--text);
      padding: 14px 18px;
      cursor: pointer;
    }
    .titlebar {
      padding: 18px 20px;
    }
    .eyebrow {
      color: #68d6ff;
      
      letter-spacing: 0.18em;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      font-weight: 800;
    }
    .viewport {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 24px;
      overflow: hidden;
      min-height: 620px;
      background: #000;
    }
    #app {
      position: absolute;
      inset: 0;
    }
    .legend {
      position: absolute;
      left: 14px;
      top: 14px;
      z-index: 2;
      display: flex;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(5, 10, 15, 0.84);
      border: 1px solid rgba(89, 132, 159, 0.24);
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
    }
    .legend i {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 6px;
    }
    @media (max-width: 760px) {
      .topbar { min-height: 74px; padding: 14px; }
      .brand { font-size: 18px; gap: 12px; }
      .actions { gap: 8px; }
      .btn { min-width: 108px; padding: 12px 14px;  }
      .viewport { min-height: 520px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div>MEMEFLOW</div>
      </div>
      <div class="actions">
        <button class="btn">Trading</button>
        <button class="btn">Settings</button>
        <button class="btn" id="resetView">Reset view</button>
      </div>
    </div>

    <div class="titlebar">
      <div class="eyebrow">REAL-TIME ARCHITECTURE</div>
      <h1>Live MEMEFLOW pipeline</h1>
    </div>

    <div class="viewport">
      <div class="legend">
        <span><i style="background:#9ba7b4"></i>WAITING</span>
        <span><i style="background:#4b75ff"></i>WATCH</span>
        <span><i style="background:#f06578"></i>BLOCKED</span>
        <span><i style="background:#66f0a6"></i>BUY READY</span>
      </div>
      <div id="app"></div>
    </div>
  </div>

  <script type="module">
    import { bootMemeflowTrue3D } from './memeflow-3d/scene.js';
    bootMemeflowTrue3D('app');
  </script>
</body>
</html>
