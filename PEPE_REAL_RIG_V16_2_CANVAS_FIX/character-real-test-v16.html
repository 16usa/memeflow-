<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PEPE REAL RIG V16.2</title>
<style>
:root{
  --hud-top:max(14px, env(safe-area-inset-top));
  --hud-h:112px;
  --controls-h:92px;
  --safe-bottom:max(14px, env(safe-area-inset-bottom));
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  min-height:100%;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%, #10262c 0%, #061115 42%, #020708 76%);
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

/* REAL game viewport. Canvas lives ONLY here. */
#stage{
  position:fixed;
  left:0;
  right:0;
  top:calc(var(--hud-top) + var(--hud-h));
  bottom:calc(var(--safe-bottom) + var(--controls-h));
  overflow:hidden;
  contain:strict;
  touch-action:none;
}

#stage canvas{
  position:absolute !important;
  inset:0 !important;
  display:block !important;
  width:100% !important;
  height:100% !important;
  max-width:none !important;
  max-height:none !important;
}

#hud{
  position:fixed;
  top:var(--hud-top);
  left:18px;
  right:18px;
  height:96px;
  padding:13px 15px;
  border:1px solid #1b5d4a;
  border-radius:14px;
  color:#fff;
  background:#041013ee;
  z-index:5;
  font-size:12px;
  letter-spacing:.12em;
}

#hud strong{
  display:block;
  margin-bottom:6px;
  color:#7fffc8;
  line-height:1.35;
}

#buttons{
  position:fixed;
  left:18px;
  right:18px;
  bottom:var(--safe-bottom);
  height:72px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  z-index:5;
}

button{
  min-width:0;
  height:72px;
  border:1px solid #1b5d4a;
  border-radius:13px;
  background:#061316ed;
  color:#fff;
  font-weight:800;
}

#debug{
  position:fixed;
  right:8px;
  top:calc(var(--hud-top) + var(--hud-h) + 4px);
  z-index:7;
  color:#7fffc8;
  background:#03100db8;
  border:1px solid #1b5d4a;
  border-radius:7px;
  padding:5px 7px;
  font:700 9px/1.2 monospace;
  pointer-events:none;
}

#error{display:none}
body[data-error="1"] #error{
  display:block;
  position:fixed;
  inset:20% 8%;
  z-index:9;
  color:#ff8e8e;
  background:#180606ed;
  border:1px solid #7d2c2c;
  border-radius:14px;
  padding:18px;
}
</style>
</head>
<body>
<div id="hud">
  <strong>PEPE REAL RIG V16.2 · REAL CANVAS VIEWPORT</strong>
  <span id="state">LOADING…</span>
</div>

<div id="stage"></div>
<div id="debug">CANVAS …</div>

<div id="buttons">
  <button id="up">▲ UP</button>
  <button id="idle">● IDLE</button>
  <button id="down">▼ DOWN</button>
</div>

<div id="error">V16.2 failed to load. Check Replit/browser console.</div>

<script type="module" src="/character-real-test-v16.js?v=canvas-1620"></script>
</body>
</html>
