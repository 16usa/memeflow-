<script id="MEMEFLOW_OPENAI_CONTROL_CENTER_V1">
(()=>{
if(window.__MEMEFLOW_OPENAI_CC_V1__)return;window.__MEMEFLOW_OPENAI_CC_V1__=true;
async function api(path,method='GET',body){const r=await fetch(path,{method,credentials:'include',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d}
const st=document.createElement('style');st.id='MEMEFLOW_OPENAI_CONTROL_CENTER_STYLE_V1';st.textContent=`#mfOpenAIButton{position:fixed;right:18px;bottom:22px;z-index:119;width:48px;height:48px;border-radius:50%;border:1px solid rgba(84,221,255,.35);background:#0d141c;color:#fff;box-shadow:0 12px 34px rgba(0,0,0,.34);font-weight:900;cursor:pointer}#mfOpenAIPanel{position:fixed;right:14px;bottom:80px;z-index:119;width:min(390px,calc(100vw - 28px));max-height:72vh;overflow:auto;border:1px solid rgba(84,221,255,.22);background:#0a1017;color:#eef6fb;border-radius:16px;padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.46);display:none}#mfOpenAIPanel.open{display:block}#mfOpenAIPanel h3{margin:0 0 4px;font-size:14px}#mfOpenAIPanel .mfai-sub{font-size:10px;color:#8494a6;margin-bottom:10px}#mfOpenAIPanel .mfai-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}#mfOpenAIPanel button{border:1px solid #263443;background:#111a24;color:#eef6fb;border-radius:9px;padding:8px 10px;font-size:10px}#mfOpenAIPanel input,#mfOpenAIPanel textarea{width:100%;border:1px solid #263443;background:#070c12;color:#eef6fb;border-radius:9px;padding:9px;font:inherit;font-size:11px}#mfOpenAIPanel textarea{min-height:68px;resize:vertical}#mfOpenAIOut{white-space:pre-wrap;font-size:10px;line-height:1.5;background:#070c12;border:1px solid #1b2733;border-radius:10px;padding:10px;min-height:70px}#mfOpenAIStatus{font-size:9px;color:#54ddff}@media(max-width:600px){#mfOpenAIButton{right:14px;bottom:76px}#mfOpenAIPanel{bottom:132px}}`;document.head.appendChild(st);
const btn=document.createElement('button');btn.id='mfOpenAIButton';btn.type='button';btn.textContent='AI';btn.setAttribute('aria-label','MEMEFLOW OpenAI');
const panel=document.createElement('section');panel.id='mfOpenAIPanel';panel.innerHTML=`<h3>MEMEFLOW OpenAI</h3><div class="mfai-sub">Per-user AI · Analyze · Assist · Auto AI · Learning · Strategy Coach</div><div id="mfOpenAIStatus">Checking…</div><div class="mfai-row"><button type="button" data-mfai="status">Status</button><button type="button" data-mfai="analyze">Analyze token</button><button type="button" data-mfai="auto">AUTO AI</button><button type="button" data-mfai="strategy">Strategy</button></div><input id="mfOpenAIMint" placeholder="Solana mint address"/><textarea id="mfOpenAIMessage" placeholder="Ask MEMEFLOW AI anything about this token, your settings, or the site…"></textarea><div class="mfai-row"><button type="button" data-mfai="ask">Ask AI</button></div><div id="mfOpenAIOut">Ready.</div>`;document.body.append(btn,panel);btn.addEventListener('click',()=>panel.classList.toggle('open'));
const out=panel.querySelector('#mfOpenAIOut'),mint=panel.querySelector('#mfOpenAIMint'),msg=panel.querySelector('#mfOpenAIMessage'),status=panel.querySelector('#mfOpenAIStatus');function show(v){out.textContent=typeof v==='string'?v:JSON.stringify(v,null,2)}
async function refresh(){try{const d=await api('/api/openai/status');status.textContent=d.configured?`OpenAI connected · isolated per user · AUTO AI ${d.settings?.autoAi?'ON':'OFF'}`:'OpenAI key missing · add OPENAI_API_KEY in Replit Secrets'}catch(e){status.textContent='OpenAI status unavailable: '+e.message}}
panel.addEventListener('click',async e=>{const action=e.target?.dataset?.mfai;if(!action)return;try{e.target.disabled=true;show('Working…');if(action==='status')show(await api('/api/openai/status'));if(action==='analyze')show(await api('/api/openai/analyze','POST',{mint:mint.value.trim()}));if(action==='auto')show(await api('/api/openai/auto','POST',{mint:mint.value.trim()}));if(action==='strategy')show(await api('/api/openai/strategy','POST',{}));if(action==='ask'){const d=await api('/api/openai/chat','POST',{message:msg.value,mint:mint.value.trim()||null});show(d.text||d)}}catch(err){show('ERROR: '+err.message)}finally{e.target.disabled=false;refresh()}});refresh();
})();
</script>
